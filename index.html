<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sim-panel" aria-label="Gravity simulator">
        <canvas id="gravity-canvas" width="1280" height="720"></canvas>
        <div id="thruster-controls" class="thruster-controls" aria-label="Ship power controls">
          <div class="battery-widget" aria-label="Ship battery">
            <div class="battery-widget__shell" aria-hidden="true">
              <span class="battery-widget__bar"></span>
              <span class="battery-widget__bar"></span>
              <span class="battery-widget__bar"></span>
              <span class="battery-widget__bar"></span>
              <span class="battery-widget__bar"></span>
            </div>
            <span id="battery-percent" class="battery-widget__percent">100%</span>
          </div>
          <div class="thruster-switches" aria-label="Thruster switches">
            <button class="thruster-switch" type="button" data-thruster-slot="mainBack" aria-pressed="false"><span>1</span><small>3u/s</small></button>
            <button class="thruster-switch" type="button" data-thruster-slot="frontLeft" aria-pressed="false"><span>2</span><small>1u/s</small></button>
            <button class="thruster-switch" type="button" data-thruster-slot="frontRight" aria-pressed="false"><span>3</span><small>1u/s</small></button>
            <button class="thruster-switch" type="button" data-thruster-slot="topLeft" aria-pressed="false"><span>4</span><small>1u/s</small></button>
            <button class="thruster-switch" type="button" data-thruster-slot="topRight" aria-pressed="false"><span>5</span><small>1u/s</small></button>
            <button class="thruster-switch" type="button" data-thruster-slot="bottomLeft" aria-pressed="false"><span>6</span><small>1u/s</small></button>
            <button class="thruster-switch" type="button" data-thruster-slot="bottomRight" aria-pressed="false"><span>7</span><small>1u/s</small></button>
          </div>
          <label class="power-control" for="thruster-power">
            <span>Power</span>
            <input id="thruster-power" type="range" min="0" max="100" value="100" />
            <output id="thruster-power-value" for="thruster-power">100%</output>
          </label>
        </div>
      </section>
      <aside class="hud" aria-label="Simulator data">
        <h1>Gravity</h1>
        <dl>
          <div>
            <dt>Time</dt>
            <dd id="hud-time">0.0s</dd>
          </div>
          <div>
            <dt>Entities</dt>
            <dd id="hud-entities">0</dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd id="hud-status">Running</dd>
          </div>
        </dl>
        <div class="legend" aria-label="Entity colors">
          <span><i class="legend-ship"></i>Ship</span>
          <span><i class="legend-main"></i>Main</span>
          <span><i class="legend-reverse"></i>Reverse</span>
          <span><i class="legend-side-up"></i>Up side</span>
          <span><i class="legend-side-down"></i>Down side</span>
        </div>
      </aside>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
