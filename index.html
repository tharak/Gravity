<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sim-panel" aria-label="Gravity simulator">
        <canvas id="gravity-canvas" width="1280" height="720"></canvas>
        <div class="ship-controls" aria-label="Ship controls">
          <div id="touch-joystick" class="touch-joystick" aria-label="Ship thrust control">
            <div class="touch-joystick__ring">
              <div class="touch-joystick__handle"></div>
            </div>
          </div>
          <div class="side-thruster-controls">
            <button id="top-thrusters" class="side-thruster-control side-thruster-control--top" type="button">
              <span class="side-thruster-control__fill"></span>
              <span>Top</span>
            </button>
            <button id="bottom-thrusters" class="side-thruster-control side-thruster-control--bottom" type="button">
              <span class="side-thruster-control__fill"></span>
              <span>Bottom</span>
            </button>
          </div>
          <div class="control-options">
            <label><input id="invert-stick" type="checkbox" />Invert</label>
            <label><input id="align-stick" type="checkbox" checked />Ship align</label>
          </div>
        </div>
      </section>
      <aside class="hud" aria-label="Simulator data">
        <h1>Gravity</h1>
        <dl>
          <div>
            <dt>Time</dt>
            <dd id="hud-time">0.0s</dd>
          </div>
          <div>
            <dt>Entities</dt>
            <dd id="hud-entities">0</dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd id="hud-status">Running</dd>
          </div>
        </dl>
        <div class="legend" aria-label="Entity colors">
          <span><i class="legend-ship"></i>Ship</span>
          <span><i class="legend-main"></i>Main</span>
          <span><i class="legend-reverse"></i>Reverse</span>
          <span><i class="legend-side-up"></i>Up side</span>
          <span><i class="legend-side-down"></i>Down side</span>
        </div>
      </aside>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
