<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sim-panel" aria-label="Gravity simulator">
        <canvas id="gravity-canvas" width="1280" height="720"></canvas>
        <div id="thruster-controls" class="thruster-controls" aria-label="Manual controller">
          <div class="battery-widget" aria-label="Ship battery">
            <div class="battery-widget__shell" aria-hidden="true">
              <span class="battery-widget__bar"></span>
              <span class="battery-widget__bar"></span>
              <span class="battery-widget__bar"></span>
              <span class="battery-widget__bar"></span>
              <span class="battery-widget__bar"></span>
            </div>
            <span id="battery-percent" class="battery-widget__percent">100%</span>
          </div>
          <div class="thruster-switches" aria-label="Thruster switches">
            <button class="thruster-switch" type="button" data-thruster-slot="mainBack" aria-pressed="false">1</button>
            <button class="thruster-switch" type="button" data-thruster-slot="frontLeft" aria-pressed="false">2</button>
            <button class="thruster-switch" type="button" data-thruster-slot="frontRight" aria-pressed="false">3</button>
            <button class="thruster-switch" type="button" data-thruster-slot="topLeft" aria-pressed="false">4</button>
            <button class="thruster-switch" type="button" data-thruster-slot="topRight" aria-pressed="false">5</button>
            <button class="thruster-switch" type="button" data-thruster-slot="bottomLeft" aria-pressed="false">6</button>
            <button class="thruster-switch" type="button" data-thruster-slot="bottomRight" aria-pressed="false">7</button>
          </div>
          <fieldset class="speed-control" aria-label="Speed order">
            <legend>Speed</legend>
            <button class="speed-button" type="button" data-speed-order="one-third" aria-label="One-third speed" aria-pressed="false">1/3</button>
            <button class="speed-button" type="button" data-speed-order="two-thirds" aria-label="Two-thirds speed" aria-pressed="false">2/3</button>
            <button class="speed-button is-active" type="button" data-speed-order="standard" aria-label="Standard speed" aria-pressed="true">STD</button>
            <button class="speed-button" type="button" data-speed-order="full" aria-label="Full speed" aria-pressed="false">FULL</button>
            <button class="speed-button" type="button" data-speed-order="flank" aria-label="Flank speed" aria-pressed="false">FLANK</button>
          </fieldset>
        </div>
      </section>
      <aside class="hud" aria-label="Simulator data">
        <h1>Gravity</h1>
        <dl>
          <div>
            <dt>Time</dt>
            <dd id="hud-time">0.0s</dd>
          </div>
          <div>
            <dt>Entities</dt>
            <dd id="hud-entities">0</dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd id="hud-status">Running</dd>
          </div>
        </dl>
        <div class="legend" aria-label="Entity colors">
          <span><i class="legend-ship"></i>Ship</span>
          <span><i class="legend-main"></i>Main</span>
          <span><i class="legend-reverse"></i>Reverse</span>
          <span><i class="legend-side-up"></i>Up side</span>
          <span><i class="legend-side-down"></i>Down side</span>
        </div>
      </aside>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
