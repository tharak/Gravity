<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sim-panel" aria-label="Gravity simulator">
        <canvas id="gravity-canvas" width="1280" height="720"></canvas>
        <div id="thruster-controls" class="thruster-controls" aria-label="Ship thruster controls">
          <button class="thruster-button thruster-button--diagonal" type="button" data-thrust-x="-1" data-thrust-y="-1" aria-label="Up left thruster">↖</button>
          <button class="thruster-button thruster-button--cardinal" type="button" data-thrust-x="0" data-thrust-y="1" aria-label="Front reverse thrusters">↑</button>
          <button class="thruster-button thruster-button--diagonal" type="button" data-thrust-x="1" data-thrust-y="-1" aria-label="Up right thruster">↗</button>
          <button class="thruster-button thruster-button--cardinal" type="button" data-thrust-x="-1" data-thrust-y="0" aria-label="Left thruster">←</button>
          <span class="thruster-controls__center" aria-hidden="true"></span>
          <button class="thruster-button thruster-button--cardinal" type="button" data-thrust-x="1" data-thrust-y="0" aria-label="Right thruster">→</button>
          <button class="thruster-button thruster-button--diagonal" type="button" data-thrust-x="-1" data-thrust-y="1" aria-label="Down left thruster">↙</button>
          <button class="thruster-button thruster-button--cardinal" type="button" data-thrust-x="0" data-thrust-y="-1" aria-label="Main back thruster">↓</button>
          <button class="thruster-button thruster-button--diagonal" type="button" data-thrust-x="1" data-thrust-y="1" aria-label="Down right thruster">↘</button>
        </div>
      </section>
      <aside class="hud" aria-label="Simulator data">
        <h1>Gravity</h1>
        <dl>
          <div>
            <dt>Time</dt>
            <dd id="hud-time">0.0s</dd>
          </div>
          <div>
            <dt>Entities</dt>
            <dd id="hud-entities">0</dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd id="hud-status">Running</dd>
          </div>
        </dl>
        <div class="legend" aria-label="Entity colors">
          <span><i class="legend-ship"></i>Ship</span>
          <span><i class="legend-main"></i>Main</span>
          <span><i class="legend-reverse"></i>Reverse</span>
          <span><i class="legend-side-up"></i>Up side</span>
          <span><i class="legend-side-down"></i>Down side</span>
        </div>
      </aside>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
